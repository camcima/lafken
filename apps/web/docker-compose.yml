# docker-compose for local web testing with a local Backend. Adjust environment variables as needed for your setup.

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.local
    ports:
      - "8080:8080"
    # Allows the container to reach services on the host machine (e.g. a local Backend).
    # On Linux, host.docker.internal requires this extra_hosts entry.
    # On macOS/Windows it works automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ── App ──────────────────────────────────────────────────────────────────
      ENVIRONMENT: intg
      AUTH_PROVIDER: oidc

      # ── OIDC ─────────────────────────────────────────────────────────────────
      # dev-oidc runs in apps/backend/docker-compose.yml and is reached via the
      # host network bridge (host.docker.internal → host port 8095).
      # Start it first: docker compose -f apps/backend/docker-compose.yml up -d dev-oidc
      OIDC_AUTHORITY: http://host.docker.internal:8095
      OIDC_CLIENT_ID: lafken-web
      OIDC_AUDIENCE: lafken-api
      OIDC_REDIRECT_URI: http://localhost:8080/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:8080/auth/login
      OIDC_SCOPES: "openid profile email"

      # ── API ───────────────────────────────────────────────────────────────────
      # The browser makes requests to this URL directly, so it must be reachable
      # from the host machine (not from inside the container).
      # Change to the deployed Backend URL for integration testing.
      API_URL: http://localhost:3000

      # ── Monitoring (optional) ─────────────────────────────────────────────────
      MONITORING_URL: ""
