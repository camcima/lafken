server {
    listen 8080;
    server_name _;
    root /opt/app-root/src;
    index index.html;

    # Log to stdout/stderr for Cloud Run (avoids permission issues)
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # Unique nonce per request — used in CSP header and injected into <script> tags by sub_filter
    set $csp_nonce $request_id;

    # Content Security Policy
    # script-src: nonce-based — only scripts with the per-request nonce execute; strict-dynamic
    #   propagates trust to modules dynamically loaded by Vite's entry point (no need to list chunks)
    # connect-src: $api_origin is replaced at container startup by entrypoint.sh with the
    #   actual origins extracted from $API_URL and $MONITORING_URL
    # style-src: 'unsafe-inline' required for Tailwind/React dynamic styles
    # frame-src: allows Microsoft Identity login popups/redirects for OIDC
    # worker-src: allows web workers from blob URLs
    # frame-ancestors 'none': same intent as X-Frame-Options: DENY, but enforced by browsers
    #   that implement CSP 2+ even when the legacy header is stripped by a proxy
    # object-src 'none': blocks <object>/<embed>/<applet> injection vectors
    # base-uri 'self': prevents an injected <base> tag from redirecting relative URLs off-origin
    # form-action 'self': blocks forms from posting to an attacker-controlled origin
    add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$csp_nonce' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' $api_origin https://login.microsoftonline.com https://*.microsoftonline.com; frame-src 'self' https://login.microsoftonline.com https://*.microsoftonline.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    location = /manifest.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
    }

    # Special handling for config.js - prevent caching and indexing
    location = /config.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Health check endpoint for Cloud Run
    location = /health {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # OIDC redirect bridge — must NOT have Cross-Origin-Opener-Policy headers
    location = /redirect.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;

        sub_filter_once off;
        sub_filter '<script ' '<script nonce="$csp_nonce" ';
    }

    # Handle client-side routing
    location / {
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$) {
            return 405;
        }

        try_files $uri $uri/ /index.html;

        # Inject per-request nonce into every <script> tag in index.html
        # Requires ngx_http_sub_module in the base image
        sub_filter_once off;
        sub_filter '<script ' '<script nonce="$csp_nonce" ';
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Exclude config.js from caching
        if ($uri = "/config.js") {
            add_header Cache-Control "no-store, no-cache" always;
        }
    }

    # Security headers (applied at server level for locations without their own add_header)
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}