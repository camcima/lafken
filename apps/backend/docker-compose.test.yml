name: lafken-backend-test
services:
  postgres-e2e:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    command:
      - "-scheme=http"
      - "-public-host=localhost:4444"
      - "-port=4443"
      - "-private-key-location=/config/fake-gcs-signer.pem"
    ports:
      - "4444:4443"
    volumes:
      - ./dev-data/gcs:/data
      - ./test/fixtures/fake-gcs-signer.pem:/config/fake-gcs-signer.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:4443/storage/v1/b > /dev/null || exit 1"
      interval: 5s
      timeout: 2s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      # Different host port from dev compose so both stacks can run in parallel.
      - "3311:3310"
    volumes:
      - ./test/fixtures/clamav/lafken-test.ndb:/var/lib/clamav/lafken-test.ndb:ro
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
