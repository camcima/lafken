name: lafken-backend-test
services:
  postgres-e2e:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    command:
      - "-scheme=http"
      - "-public-host=localhost:4444"
      - "-port=4443"
      - "-private-key-location=/config/fake-gcs-signer.pem"
    ports:
      - "4444:4443"
    volumes:
      - ./dev-data/gcs:/data
      - ./test/fixtures/fake-gcs-signer.pem:/config/fake-gcs-signer.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:4443/storage/v1/b > /dev/null || exit 1"
      interval: 5s
      timeout: 2s
      retries: 10
