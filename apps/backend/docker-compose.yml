name: lafken-backend

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestjstemplatev2
      POSTGRES_USER: nestjstemplatev2
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestjstemplatev2 -d nestjstemplatev2"]
      interval: 5s
      timeout: 5s
      retries: 5

  dev-oidc:
    image: ghcr.io/camcima/dev-oidc:0.3.1
    restart: unless-stopped
    volumes:
      - ./dev-oidc.config.json:/config/config.json:ro
      - dev_oidc_data:/data
    ports:
      - "8095:8095"
    environment:
      # Browser-side issuer. The backend container also resolves
      # http://localhost:8095 by going through the host's published port,
      # which keeps the JWT `iss` claim consistent for both sides.
      DEV_OIDC_PUBLIC_URL: http://localhost:8095
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:8095/.well-known/openid-configuration > /dev/null || exit 1"
      interval: 5s
      timeout: 2s
      retries: 10

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    restart: unless-stopped
    command:
      - "-scheme=http"
      - "-public-host=localhost:4443"
      - "-port=4443"
      # The same RSA key used by the backend's GCS_SERVICE_ACCOUNT_JSON, so
      # fake-gcs can verify v4-signed PUT URLs end-to-end in dev.
      - "-private-key-location=/config/fake-gcs-signer.pem"
      # Browser CORS preflight for signed PUT URLs sends the
      # x-goog-content-length-range header, which is not on fake-gcs's
      # default allowlist; without this the preflight returns 403.
      - "-cors-headers=x-goog-content-length-range"
    ports:
      - "4443:4443"
    volumes:
      - ./dev-data/gcs:/data
      - ./test/fixtures/fake-gcs-signer.pem:/config/fake-gcs-signer.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:4443/storage/v1/b > /dev/null || exit 1"
      interval: 5s
      timeout: 2s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_db:/var/lib/clamav
      # Custom signature catching the EICAR byte sequence anywhere inside an
      # uploaded file (PNG tEXt chunks, EXIF, JPEG trailers, etc). clamd
      # auto-loads *.ndb at startup; see test/fixtures/clamav/README.md.
      - ./test/fixtures/clamav/lafken-test.ndb:/var/lib/clamav/lafken-test.ndb:ro
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  tusd:
    image: tusproject/tusd:v2
    restart: unless-stopped
    command:
      - "-host=0.0.0.0"
      - "-port=1080"
      - "-base-path=/files/"
      - "-gcs-bucket=lafken-dev"
      - "-gcs-object-prefix="
      # Browser CORS for tus PATCH/POST/HEAD with custom headers.
      - "-cors-allow-origin=*"
      - "-cors-allow-credentials=true"
      - "-cors-allow-headers=Authorization,Content-Type,Location,Tus-Extension,Tus-Max-Size,Tus-Resumable,Tus-Version,Upload-Concat,Upload-Defer-Length,Upload-Length,Upload-Metadata,Upload-Offset,X-HTTP-Method-Override,X-Requested-With"
      - "-cors-expose-headers=Location,Tus-Extension,Tus-Max-Size,Tus-Resumable,Tus-Version,Upload-Concat,Upload-Defer-Length,Upload-Length,Upload-Metadata,Upload-Offset"
    environment:
      # tusd reads service-account credentials from
      # GOOGLE_APPLICATION_CREDENTIALS; for fake-gcs, point STORAGE_EMULATOR_HOST
      # at the container DNS instead.
      STORAGE_EMULATOR_HOST: "http://fake-gcs:4443"
      GCS_PROJECT_ID: "fake-project-1"
    ports:
      - "1080:1080"
    depends_on:
      fake-gcs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:1080/ > /dev/null || exit 1"
      interval: 5s
      timeout: 2s
      retries: 10

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # Signing — fixed dev values; rotate in real envs. The backend signs URLs
      # with the same key/salt so the browser can fetch directly from imgproxy.
      IMGPROXY_KEY: 943b421c4e44c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4
      IMGPROXY_SALT: 520b421c4e44c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4f24c4
      IMGPROXY_SIGNATURE_SIZE: 32

      # Source via fake-gcs's HTTP API. We use the http source instead of
      # imgproxy's GCS driver because fake-gcs does not implement the OAuth2
      # auth path imgproxy expects. The backend mints source URLs as
      # http://fake-gcs:4443/storage/v1/b/<bucket>/o/<key>?alt=media, which
      # works against either fake-gcs or real GCS public objects.
      #
      # Allow any path under the fake-gcs object API. The actual defense
      # against quarantined bytes leaking out lives in the backend: the
      # preview-url controller refuses to mint URLs for non-previewable
      # states, and the worker physically moves quarantined bytes to
      # `_quarantined/<key>` so previously-issued imgproxy URLs (which
      # embed the original key) start returning 404 from fake-gcs.
      IMGPROXY_ALLOWED_SOURCES: "http://fake-gcs:4443/storage/v1/b/"
      IMGPROXY_DEVELOPMENT_ERRORS_MODE: "true"
    depends_on:
      fake-gcs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "imgproxy health"
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
  dev_oidc_data:
  clamav_db:
