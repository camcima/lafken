services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestjstemplatev2
      POSTGRES_USER: nestjstemplatev2
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestjstemplatev2 -d nestjstemplatev2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
