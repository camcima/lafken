## Environment variables for the Backend as defined in the `.env` file
set-env-vars: ENV=intg,APP_PORT=3000,NODE_ENV=production,DB_NAME=lafken-intg-pgsql-db-1-us-east1-intgab3f,DB_USER=lafken-username,DB_HOST=10.46.0.48,DB_PORT=5432,AUTH_PROVIDER=oidc,OIDC_ISSUER=https://lafken-monorepo.intg.appslatam.com/dev-oidc,OIDC_AUDIENCE=lafken-api,OIDC_PRINCIPAL_CLAIM=preferred_username,OIDC_ROLES_CLAIM=roles
port: 3000
service-account: lafken-backend-sa@emx-intg-ab3d.iam.gserviceaccount.com
project: emx-intg-ab3d
region: us-east1
cpu-boost:
cpu: 2
memory: 512Mi
min-instances: 0
max-instances: 2
concurrency: 20
liveness-probe: initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=240,failureThreshold=3,httpGet.port=3000,httpGet.path=/v1/health
