# -----------------------------------------------------------------------------
# This file is used to define all the gcloud deploy options and flags in order
# to configure the Cloud Run service.
# For boolean flags, left the value empty with no quotes.
# For options that are supposed to have a empty string value, left an empty string.
# For options where the value is a list use a comma-separated string without spaces.
# See: https://docs.cloud.google.com/sdk/gcloud/reference/run/deploy
# for the available key-value pairs.
# -----------------------------------------------------------------------------

## Environment variables for the Backend as defined in the `.env` file
set-env-vars: ENV=prod,APP_PORT=3000,NODE_ENV=production,DB_NAME=REPLACE_ME_PROD_DB_NAME,DB_USER=REPLACE_ME_PROD_DB_USER,DB_HOST=REPLACE_ME_PROD_DB_HOST,DB_PORT=5432,AUTH_PROVIDER=oidc,OIDC_ISSUER=REPLACE_ME_PROD_OIDC_ISSUER,OIDC_AUDIENCE=REPLACE_ME_PROD_OIDC_AUDIENCE,OIDC_PRINCIPAL_CLAIM=preferred_username,OIDC_ROLES_CLAIM=roles
port: 3000
service-account: lafken-backend-sa@emx-prod-63eb.iam.gserviceaccount.com
project: emx-prod-63eb
region: us-east1
cpu-boost:
cpu: 4
memory: 512Mi
min-instances: 1
max-instances: 8
concurrency: 120
liveness-probe: initialDelaySeconds=10,timeoutSeconds=5,periodSeconds=240,failureThreshold=3,httpGet.port=3000,httpGet.path=/v1/health
startup-probe: initialDelaySeconds=5,timeoutSeconds=10,periodSeconds=10,failureThreshold=10,tcpSocket.port=3000
execution-environment: gen2
network: vpc-lan
subnet: sub-us-east1
vpc-egress: all-traffic
ingress: internal-and-cloud-load-balancing
no-allow-unauthenticated:
labels: cmdb-lafken=lafken,iac=false
