      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacePresetResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Create a new preset for a namespace
      tags:
        - Namespaces
  /v1/namespaces/{slug}/archive:
