openapi: 3.0.0
paths:
  /v1/health:
    get:
      operationId: ApiHealthController_checkHealth_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResultResponseDTO'
      security:
        - {}
      tags:
        - Health
  /v1/namespaces:
    get:
      operationId: NamespacesController_list_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
        - name: order
          required: false
          in: query
          schema:
            default:
              - desc
            type: array
            items:
              type: string
              enum:
                - desc
                - asc
        - name: orderBy
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNamespacesResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
      security:
        - bearer: []
      summary: List namespaces
      tags:
        - Namespaces
    post:
      operationId: NamespacesController_createNamespace_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '409':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Create a namespace with its initial policy
      tags:
        - Namespaces
  /v1/namespaces/{slug}:
    get:
      operationId: NamespacesController_getOne_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: Get a namespace by slug
      tags:
        - Namespaces
    patch:
      operationId: NamespacesController_updateNamespaceMetadata_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNamespaceMetadataRequestDTO'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Update namespace metadata
      tags:
        - Namespaces
  /v1/namespaces/{slug}/policies:
    get:
      operationId: NamespacesController_listPolicies_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamespacePolicyResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: List policy versions for a namespace
      tags:
        - Namespaces
  /v1/namespaces/{slug}/presets:
    get:
      operationId: NamespacesController_listPresets_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
