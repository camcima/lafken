info:
  title: Lafken Backend API
  description: HTTP API for the Lafken asset management service
  version: 0.0.0
  contact:
    name: grp_emx_platform_eng@latam.com
    url: mailto:grp_emx_platform_eng@latam.com
    email: grp_emx_platform_eng@latam.com
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Azure AD Bearer token authorization
  schemas:
    HealthIndicatorStatusDTO:
      type: object
      properties:
        status:
          type: string
          enum:
            - up
            - down
          description: Status of the specific health indicator
      required:
        - status
    HealthIndicatorResultResponseDTO:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/HealthIndicatorStatusDTO'
        database:
          $ref: '#/components/schemas/HealthIndicatorStatusDTO'
    HealthCheckResultResponseDTO:
      type: object
      properties:
        status:
          type: string
          enum:
            - error
            - ok
            - shutting_down
        info:
          description: Summary information about healthy health indicators
          allOf:
            - $ref: '#/components/schemas/HealthIndicatorResultResponseDTO'
        error:
          description: Summary information about failed health indicators
          allOf:
            - $ref: '#/components/schemas/HealthIndicatorResultResponseDTO'
        details:
          description: Details about all health indicators
          allOf:
            - $ref: '#/components/schemas/HealthIndicatorResultResponseDTO'
      required:
        - status
        - info
        - error
        - details
    UnauthorizedErrorResponseDTO:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
          enum:
            - UnauthorizedException
        status:
          type: number
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
      required:
        - type
        - title
        - status
        - detail
        - errors
    NamespaceResponseDTO:
      type: object
      properties:
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
        currentPolicyVersion:
          type: number
        storageBindingName:
          type: string
        archivedAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - slug
        - displayName
        - currentPolicyVersion
        - storageBindingName
        - createdAt
        - updatedAt
    PaginatedNamespacesResponseDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NamespaceResponseDTO'
        total:
          type: number
        limit:
          type: number
        page:
          type: number
        lastPage:
          type: number
      required:
        - data
        - total
        - limit
        - page
        - lastPage
    NamespacePolicyResponseDTO:
      type: object
      properties:
        version:
          type: number
        retentionDays:
          type: number
        retentionMode:
          type: string
          enum:
            - delete
            - archive
            - none
        maxFileSizeBytes:
          type: number
        allowedMimeTypes:
          type: array
          items:
            type: string
        exifHandling:
          type: string
          enum:
            - strip
            - preserve
            - extract_then_strip
        virusScanRequired:
          type: boolean
        contentModeration:
          type: object
        requiredMetadataSchema:
          type: object
        immutable:
          type: boolean
        servingMode:
          type: string
          enum:
            - public
            - signed
            - proxied
        signedUrlTtlSeconds:
          type: number
        signedUrlBucketSize:
          type: number
        retryConfig:
          type: object
        createdBy:
          type: string
        createdAt:
          type: string
      required:
        - version
        - retentionMode
        - maxFileSizeBytes
        - allowedMimeTypes
        - exifHandling
        - virusScanRequired
        - immutable
        - servingMode
        - createdAt
    NamespacePresetResponseDTO:
      type: object
      properties:
        name:
          type: string
        version:
          type: number
        params:
          type: object
        cdnMaxAge:
          type: number
        signedUrlTtl:
          type: number
        preGenerate:
          type: boolean
        requiredPermission:
          type: string
        description:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
      required:
        - name
        - version
        - params
        - preGenerate
        - active
        - createdAt
    ForbiddenErrorResponseDTO:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
          enum:
            - ForbiddenException
        status:
          type: number
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
      required:
        - type
        - title
        - status
        - detail
        - errors
    CreateNamespacePolicyDTO:
      type: object
      properties:
        retentionDays:
          type: number
          nullable: true
        retentionMode:
          type: string
          enum:
            - delete
            - archive
            - none
        maxFileSizeBytes:
          type: number
          example: 52428800
        allowedMimeTypes:
          example:
            - image/jpeg
            - image/png
            - image/webp
          type: array
          items:
            type: string
        exifHandling:
          type: string
          enum:
            - strip
            - preserve
            - extract_then_strip
        virusScanRequired:
          type: boolean
        contentModeration:
          type: object
          nullable: true
        requiredMetadataSchema:
          type: object
          nullable: true
        immutable:
          type: boolean
        servingMode:
          type: string
          enum:
            - public
            - signed
            - proxied
        signedUrlTtlSeconds:
          type: number
          nullable: true
        signedUrlBucketSize:
          type: number
          nullable: true
        retryConfig:
          type: object
          nullable: true
      required:
        - retentionMode
        - maxFileSizeBytes
        - allowedMimeTypes
        - exifHandling
        - virusScanRequired
        - immutable
        - servingMode
    CreateNamespaceRequestDTO:
      type: object
      properties:
        slug:
          type: string
          example: aircraft-photos
        displayName:
          type: string
          example: Aircraft photos
        description:
          type: string
          nullable: true
        storageBindingId:
          type: string
          description: ID of an existing storage binding (UUID)
          format: uuid
        policy:
          $ref: '#/components/schemas/CreateNamespacePolicyDTO'
      required:
        - slug
        - displayName
        - storageBindingId
        - policy
    UpdateNamespaceMetadataRequestDTO:
      type: object
      properties:
        displayName:
          type: string
        description:
          type: string
          nullable: true
      required:
        - displayName
    CreatePolicyVersionRequestDTO:
      type: object
      properties:
        policy:
          $ref: '#/components/schemas/CreateNamespacePolicyDTO'
      required:
        - policy
    PresetParamsInputDTO:
      type: object
      properties:
        width:
          type: number
          nullable: true
          minimum: 1
          maximum: 10000
        height:
          type: number
          nullable: true
          minimum: 1
          maximum: 10000
        fit:
          type: string
          enum:
            - cover
            - contain
            - fill
            - inside
            - outside
        format:
          type: string
          enum:
            - webp
            - avif
            - jpeg
            - png
            - auto
        quality:
          type: number
          minimum: 1
          maximum: 100
        dpr:
          type: number
          nullable: true
          minimum: 0.5
          maximum: 4
      required:
        - fit
        - format
        - quality
    CreatePresetRequestDTO:
      type: object
      properties:
        name:
          type: string
          example: thumbnail
        params:
          $ref: '#/components/schemas/PresetParamsInputDTO'
      required:
        - name
        - params
    UpdatePresetVersionRequestDTO:
      type: object
      properties:
        params:
          $ref: '#/components/schemas/PresetParamsInputDTO'
      required:
        - params
    SetPresetActiveRequestDTO:
      type: object
      properties:
        active:
          type: boolean
      required:
        - active
    AssetResponseDTO:
      type: object
      properties:
        id:
          type: string
          description: >-
            Internal admin-console identifier (uuidv7). Stable, never rotated.
            Used by the admin console for routes and admin-API paths. Do NOT
            expose to external consumers — they get `publicId`.
        publicId:
          type: string
          description: >-
            External-facing identifier (uuidv4). What clients of the public
            Lafken API see and persist. Used in URLs and bodies of external
            endpoints (upload-intent confirm, preview-url, download-url).
        namespaceSlug:
          type: string
        policyVersion:
          type: number
        state:
          type: string
          enum:
            - pending
            - uploaded
            - processing
            - ready
            - rejected
            - quarantined_virus
            - quarantined_moderation
            - quarantined_invalid_format
            - processing_failed
            - expired
            - deleted
        stateReason:
          type: string
        sizeBytes:
          type: number
        mimeType:
          type: string
        declaredMimeType:
          type: string
        width:
          type: number
        height:
          type: number
        contentHashHex:
          type: string
        phashHex:
          type: string
          description: >-
            16-char hex of the 64-bit DCT perceptual hash. Two visually similar
            images produce a low Hamming distance over these 64 bits.
            Null/absent for non-image payloads or when computation failed.
        uploadedBy:
          type: string
        externalRefType:
          type: string
        externalRefId:
          type: string
        customMetadata:
          type: object
        captureContext:
          type: object
        tags:
          description: >-
            Free-form tags attached to the asset. First-class column; filterable
            via `?tags=`.
          type: array
          items:
            type: string
        legalHold:
          type: boolean
        legalHoldReference:
          type: string
          nullable: true
        confirmedAt:
          type: string
        stateChangedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - publicId
        - namespaceSlug
        - policyVersion
        - state
        - customMetadata
        - tags
        - legalHold
        - stateChangedAt
        - createdAt
    PaginatedAssetResponseDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AssetResponseDTO'
        total:
          type: number
        limit:
          type: number
        page:
          type: number
        lastPage:
          type: number
      required:
        - data
        - total
        - limit
        - page
        - lastPage
    PreviewUrlResponseDTO:
      type: object
      properties:
        url:
          type: string
          description: Fully-signed imgproxy URL the browser can fetch directly.
      required:
        - url
    AssetDownloadUrlResponseDTO:
      type: object
      properties:
        url:
          type: string
          description: >-
            Fully-signed GCS read URL the browser can fetch directly to download
            the original asset bytes. Valid for ~5 minutes.
      required:
        - url
    AssetStateTransitionResponseDTO:
      type: object
      properties:
        fromState:
          type: string
          enum:
            - pending
            - uploaded
            - processing
            - ready
            - rejected
            - quarantined_virus
            - quarantined_moderation
            - quarantined_invalid_format
            - processing_failed
            - expired
            - deleted
        toState:
          type: string
          enum:
            - pending
            - uploaded
            - processing
            - ready
            - rejected
            - quarantined_virus
            - quarantined_moderation
            - quarantined_invalid_format
            - processing_failed
            - expired
            - deleted
        reason:
          type: string
        metadata:
          type: object
        occurredBy:
          type: string
        occurredAt:
          type: string
      required:
        - toState
        - occurredAt
    AssetAnalysisResponseDTO:
      type: object
      properties:
        analyzer:
          type: string
        analyzerVersion:
          type: string
        findings:
          type: object
        decision:
          type: string
          enum:
            - pass
            - flag
            - quarantine
            - error
        occurredAt:
          type: string
      required:
        - analyzer
        - findings
        - occurredAt
    ProcessingJobResponseDTO:
      type: object
      properties:
        state:
          type: string
          enum:
            - claimed
            - released
            - completed
            - failed
        workerId:
          type: string
        currentStep:
          type: string
        attemptNumber:
          type: number
        notBefore:
          type: string
        lastError:
          type: string
        lastErrorAt:
          type: string
        heartbeatAt:
          type: string
        claimedAt:
          type: string
        createdAt:
          type: string
      required:
        - state
        - attemptNumber
        - createdAt
    CreateUploadIntentRequestDTO:
      type: object
      properties:
        namespaceSlug:
          type: string
          example: aircraft-photos
        declaredMimeType:
          type: string
          example: image/jpeg
        declaredSizeBytes:
          type: number
          example: 102400
          minimum: 1
      required:
        - namespaceSlug
        - declaredMimeType
        - declaredSizeBytes
    CreateUploadIntentResponseDTO:
      type: object
      properties:
        publicId:
          type: string
        uploadUrl:
          type: string
        uploadHeaders:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          description: ISO-8601 timestamp when the URL expires
      required:
        - publicId
        - uploadUrl
        - uploadHeaders
        - expiresAt
    ConfirmUploadRequestDTO:
      type: object
      properties:
        width:
          type: number
        height:
          type: number
    QuarantinedAssetResponseDTO:
      type: object
      properties:
        id:
          type: string
          description: >-
            Internal admin-console identifier (uuidv7). Stable, never rotated.
            Used by the admin console for routes and admin-API paths. Do NOT
            expose to external consumers — they get `publicId`.
        publicId:
          type: string
          description: >-
            External-facing identifier (uuidv4). What clients of the public
            Lafken API see and persist. Used in URLs and bodies of external
            endpoints (upload-intent confirm, preview-url, download-url).
        namespaceSlug:
          type: string
        policyVersion:
          type: number
        state:
          type: string
          enum:
            - pending
            - uploaded
            - processing
            - ready
            - rejected
            - quarantined_virus
            - quarantined_moderation
            - quarantined_invalid_format
            - processing_failed
            - expired
            - deleted
        stateReason:
          type: string
        sizeBytes:
          type: number
        mimeType:
          type: string
        declaredMimeType:
          type: string
        width:
          type: number
        height:
          type: number
        contentHashHex:
          type: string
        phashHex:
          type: string
          description: >-
            16-char hex of the 64-bit DCT perceptual hash. Two visually similar
            images produce a low Hamming distance over these 64 bits.
            Null/absent for non-image payloads or when computation failed.
        uploadedBy:
          type: string
        externalRefType:
          type: string
        externalRefId:
          type: string
        customMetadata:
          type: object
        captureContext:
          type: object
        tags:
          description: >-
            Free-form tags attached to the asset. First-class column; filterable
            via `?tags=`.
          type: array
          items:
            type: string
        legalHold:
          type: boolean
        legalHoldReference:
          type: string
          nullable: true
        confirmedAt:
          type: string
        stateChangedAt:
          type: string
        createdAt:
          type: string
        quarantineKind:
          type: string
          enum:
            - virus
            - moderation
            - invalid_format
        flaggedAnalyzer:
          type: string
        flaggedCategory:
          type: string
        flaggedScore:
          type: number
        flaggedAt:
          type: string
      required:
        - id
        - publicId
        - namespaceSlug
        - policyVersion
        - state
        - customMetadata
        - tags
        - legalHold
        - stateChangedAt
        - createdAt
        - quarantineKind
        - flaggedAt
    PaginatedQuarantinedAssetResponseDTO:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuarantinedAssetResponseDTO'
