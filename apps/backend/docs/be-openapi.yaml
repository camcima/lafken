        '409':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Create a new policy version for a namespace
      tags:
        - Namespaces
  /v1/namespaces/{slug}/presets/{name}/versions:
    post:
      operationId: NamespacesController_updatePresetVersion_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
        - name: name
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresetVersionRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacePresetResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '409':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Create a new version of an existing preset
      tags:
        - Namespaces
  /v1/namespaces/{slug}/presets/{name}:
    patch:
      operationId: NamespacesController_setPresetActive_v1
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
        - name: name
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPresetActiveRequestDTO'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespacePresetResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Activate or deactivate a preset
      tags:
        - Namespaces
  /v1/assets:
    get:
      operationId: AssetsController_list_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
        - name: order
          required: false
          in: query
          schema:
            default:
              - desc
            type: array
            items:
              type: string
              enum:
                - desc
                - asc
        - name: orderBy
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: namespaceSlug
          required: false
          in: query
          schema:
            type: string
        - name: states
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - pending
                - uploaded
                - processing
                - ready
                - rejected
                - quarantined_virus
                - quarantined_moderation
                - quarantined_invalid_format
                - processing_failed
                - expired
                - deleted
        - name: uploadedBy
          required: false
          in: query
          schema:
            type: string
        - name: externalRefType
          required: false
          in: query
          schema:
            type: string
        - name: externalRefId
          required: false
          in: query
          schema:
            type: string
        - name: tags
          required: false
          in: query
          description: >-
            Filter by tags. Comma-separated. Asset must contain ALL listed tags
            (`array @> ARRAY[...]`).
          schema:
            type: array
            items:
              type: string
        - name: uploadedFrom
          required: false
          in: query
          schema:
            type: string
        - name: uploadedTo
          required: false
          in: query
          schema:
            type: string
        - name: q
          required: false
          in: query
          description: >-
            Free-text search applied across public_id, external_ref_id,
            uploaded_by, the hex-encoded content_hash, and any tag value.
            Matches are case-insensitive substring.
          schema:
            type: string
        - name: legalHoldId
          required: false
          in: query
          description: >-
            Filter to assets covered by a specific legal hold (active or
            lifted).
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
      security:
        - bearer: []
      summary: List assets
      tags:
        - Assets
  /v1/assets/{id}:
    get:
      operationId: AssetsController_getOne_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: Get an asset by internal id
      tags:
        - Assets
  /v1/assets/{publicId}/preview-url:
    get:
      operationId: AssetsController_getPreviewUrl_v1
      parameters:
        - name: publicId
          required: true
          in: path
          schema:
            type: string
        - name: preset
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewUrlResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: Mint a signed preview URL for an asset against a named preset
      tags:
        - Assets
  /v1/assets/{publicId}/download-url:
    get:
      description: >-
        Returns a fully-signed GCS read URL the browser can fetch directly to
        download the asset's original bytes. The URL is valid for ~5 minutes.
      operationId: AssetsController_getDownloadUrl_v1
      parameters:
        - name: publicId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDownloadUrlResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: Mint a signed read URL for an asset's original bytes
      tags:
        - Assets
  /v1/assets/{id}/state-transitions:
    get:
      operationId: AssetsController_listStateTransitions_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetStateTransitionResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: List state transitions for an asset
      tags:
        - Assets
  /v1/assets/{id}/analyses:
    get:
      operationId: AssetsController_listAnalyses_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetAnalysisResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: List analyses for an asset
      tags:
        - Assets
  /v1/assets/{id}/processing-job:
    get:
      operationId: AssetsController_getProcessingJob_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingJobResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '404':
          description: ''
      security:
        - bearer: []
      summary: Get the processing job for an asset
      tags:
        - Assets
  /v1/assets/upload-intents:
    post:
      operationId: AssetsController_createUploadIntent_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadIntentRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadIntentResponseDTO'
        '400':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Issue a signed URL for a new asset upload
      tags:
        - Assets
  /v1/assets/{publicId}/confirm:
    post:
      operationId: AssetsController_confirmUpload_v1
      parameters:
        - name: publicId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequestDTO'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Confirm a successful upload to a signed URL
      tags:
        - Assets
  /v1/assets/{id}/retry-processing:
    post:
      description: >-
        Re-primes the asset's processing job for another worker attempt and
        transitions the asset from `processing_failed` back to `uploaded`. The
        worker will pick the asset up on its next tick. Only valid when the
        asset is currently in `processing_failed`.
      operationId: AssetsController_retryProcessing_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
        '404':
          description: ''
        '422':
          description: ''
      security:
        - bearer: []
      summary: Retry processing for an asset whose previous processing attempts failed
      tags:
        - Assets
  /v1/quarantine:
    get:
      operationId: QuarantineController_list_v1
      parameters:
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: number
        - name: order
          required: false
          in: query
          schema:
            default:
              - desc
            type: array
            items:
              type: string
              enum:
                - desc
                - asc
        - name: orderBy
          required: false
          in: query
          schema:
            type: array
            items:
              type: string
        - name: kind
          required: false
          in: query
          schema:
            type: string
            enum:
              - virus
              - moderation
              - invalid_format
        - name: namespaceSlug
          required: false
          in: query
          schema:
            type: string
        - name: flaggedFrom
          required: false
          in: query
          schema:
            type: string
        - name: flaggedTo
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQuarantinedAssetResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
      security:
        - bearer: []
      summary: List quarantined assets
      tags:
        - Quarantine
  /v1/quarantine/{publicId}/release:
    post:
      description: >-
        Content-reviewer only. Moves the bytes back from `_quarantined/<key>` to
        the original key (when applicable) and transitions the asset to `ready`
        with the reviewer's note recorded in the audit trail. Refuses when the
        asset is not currently quarantined or is under legal hold.
      operationId: QuarantineController_release_v1
      parameters:
        - name: publicId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseQuarantinedAssetRequestDTO'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponseDTO'
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponseDTO'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponseDTO'
          description: ''
      security:
        - bearer: []
        - bearer: []
      summary: Release a quarantined asset back to ready
      tags:
        - Quarantine
  /v1/quarantine/{publicId}/reject:
    post:
      description: >-
        Content-reviewer only. Marks the asset terminal in `rejected`. The
        original bytes remain in `_quarantined/<key>` until the namespace
        retention sweep removes them. Refuses when the asset is not currently
        quarantined or is under legal hold.
      operationId: QuarantineController_reject_v1
      parameters:
        - name: publicId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
